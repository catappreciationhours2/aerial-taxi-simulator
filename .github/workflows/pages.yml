# Publishes the simulator (static files, no build step) to GitHub Pages on every push to main.
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only what the browser needs)
        run: |
          mkdir _site
          cp index.html _site/
          cp -r web src _site/
          if [ -d data ]; then cp -r data _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4